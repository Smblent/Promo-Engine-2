<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Official links for Your Artist Name. Stream the latest single on Spotify, Apple Music, YouTube, and more.">
    <title>Your Artist Name — Official Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border: #2c2c2e;
            --text: #ffffff;
            --text-secondary: #888888;
            --text-muted: #444444;
            --accent: #0A84FF;
            --accent-text: #000000;
            --tap-highlight: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 2.5rem 1.25rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a3e 0%, #0a0a1a 100%);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            border: 2px solid #333;
            box-shadow: 0 8px 32px rgba(10, 132, 255, 0.08);
            flex-shrink: 0;
        }

        .badge {
            background: var(--accent);
            color: var(--accent-text);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 1.25rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 0.4rem;
            letter-spacing: -0.6px;
            line-height: 1.1;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 16px;
            line-height: 1.4;
            font-weight: 400;
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--surface);
            color: var(--text);
            padding: 17px;
            width: 100%;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.15s ease, background 0.15s ease;
            border: 1px solid var(--border);
            -webkit-tap-highlight-color: var(--tap-highlight);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .link-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.06) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .link-btn:hover {
            background: var(--surface-hover);
            transform: scale(0.985);
        }

        .link-btn:hover::after {
            opacity: 1;
        }

        .link-btn:active {
            transform: scale(0.96);
            transition-duration: 0.05s;
        }

        .link-icon {
            font-size: 18px;
            line-height: 1;
        }

        .footer {
            margin-top: 2.5rem;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            .badge { animation: none; }
            .link-btn { transition: none; }
        }

        /* Dark mode is default, but respect system preference */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f5f5f7;
                --surface: #ffffff;
                --surface-hover: #f0f0f2;
                --border: #e0e0e2;
                --text: #000000;
                --text-secondary: #666666;
                --text-muted: #999999;
                --accent: #0071e3;
                --accent-text: #ffffff;
            }
            .avatar {
                border-color: #d0d0d2;
                box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="avatar" role="img" aria-label="Artist avatar">&#127925;</div>
        
        <div class="badge" aria-label="New release indicator">
            <span>&#128308;</span>
            <span>NEW MUSIC OUT NOW</span>
        </div>
        
        <h1>Your Artist Name</h1>
        <p class="subtitle">Latest single streaming everywhere</p>

        <nav class="links" aria-label="Social and streaming links">
            <a href="YOUR_SPOTIFY_LINK" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="link-icon">&#127925;</span>
                <span>Spotify</span>
            </a>
            <a href="YOUR_APPLE_LINK" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="link-icon">&#127822;</span>
                <span>Apple Music</span>
            </a>
            <a href="YOUR_YOUTUBE_LINK" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="link-icon">&#9654;</span>
                <span>YouTube</span>
            </a>
            <a href="YOUR_SOUNDCLOUD_LINK" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="link-icon">&#9729;</span>
                <span>SoundCloud</span>
            </a>
            <a href="YOUR_BANDCAMP_LINK" target="_blank" rel="noopener noreferrer" class="link-btn">
                <span class="link-icon">&#128190;</span>
                <span>Bandcamp</span>
            </a>
        </nav>

        <footer class="footer">Made with Promo Engine</footer>
    </main>
</body>
</html>
