<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Promo Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border: #2c2c2e;
            --text: #ffffff;
            --text-secondary: #888888;
            --text-muted: #444444;
            --accent: #0A84FF;
            --accent-text: #000000;
            --danger: #ff453a;
            --success: #30d158;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Views */
        .view {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            width: 100%;
        }

        .view.active { display: flex; }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Typography */
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 1.5rem; text-align: center; }
        .subtitle { color: var(--text-secondary); font-size: 16px; margin-bottom: 2rem; text-align: center; }

        /* Forms */
        .form-group {
            width: 100%;
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="url"], input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-text);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-small {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 10px;
            width: auto;
        }

        /* Account List */
        .account-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 1rem;
        }

        .account-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .account-card:hover { background: var(--surface-hover); }

        .account-info { display: flex; align-items: center; gap: 12px; }
        .account-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #1a1a3e, #0a0a1a);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; border: 1px solid #333;
        }
        .account-name { font-weight: 700; font-size: 15px; }

        /* Bio Page */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 12px 16px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .avatar {
            width: 120px; height: 120px; border-radius: 50%;
            background: linear-gradient(135deg, #1a1a3e, #0a0a1a);
            margin-bottom: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; border: 2px solid #333;
            box-shadow: 0 8px 32px rgba(10,132,255,0.08);
        }

        .badge {
            background: var(--accent);
            color: var(--accent-text);
            padding: 8px 16px; border-radius: 100px;
            font-size: 13px; font-weight: 700;
            margin-bottom: 1.25rem;
            display: inline-flex; align-items: center; gap: 6px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--surface); color: var(--text);
            padding: 17px; width: 100%; border-radius: 14px;
            text-decoration: none; font-weight: 600; font-size: 16px;
            transition: transform 0.15s ease, background 0.15s ease;
            border: 1px solid var(--border);
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .link-btn:hover { background: var(--surface-hover); transform: scale(0.985); }
        .link-btn:active { transform: scale(0.96); }
        .link-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .link-icon { font-size: 18px; }

        .empty-state {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 2rem 1rem;
            border: 2px dashed var(--border);
            border-radius: 14px;
        }

        .footer {
            margin-top: 2.5rem;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            overflow-y: auto;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .modal-title { font-size: 20px; font-weight: 800; }

        .close-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 24px; cursor: pointer; padding: 4px;
        }

        .link-editor {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .link-editor-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px; font-weight: 700; font-size: 14px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 1.5rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .badge { animation: none; }
            .btn, .link-btn { transition: none; }
        }
    </style>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="view active">
        <div class="container">
            <div style="font-size: 48px; margin-bottom: 1rem;">&#127925;</div>
            <h1>Promo Engine</h1>
            <p class="subtitle">Create or select an artist profile</p>

            <div class="form-group">
                <label for="artistNameInput">Artist Name</label>
                <input type="text" id="artistNameInput" placeholder="e.g. Neon Dreams" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="pinInput">PIN (4 digits, optional)</label>
                <input type="password" id="pinInput" placeholder="0000" maxlength="4" inputmode="numeric">
            </div>

            <button class="btn btn-primary" onclick="login()">Create / Login</button>

            <div id="savedAccountsSection" style="width:100%; margin-top:2rem; display:none;">
                <label>Saved Accounts</label>
                <div class="account-list" id="accountList"></div>
            </div>
        </div>
    </div>

    <!-- APP VIEW -->
    <div id="appView" class="view">
        <div class="top-bar">
            <button class="btn btn-secondary btn-small" onclick="openEditor()">&#9998; Edit</button>
            <button class="btn btn-secondary btn-small" onclick="logout()">Switch Account</button>
        </div>

        <div class="container">
            <div class="avatar" id="displayAvatar" role="img" aria-label="Artist avatar">&#127925;</div>
            <div class="badge" id="displayBadge"><span id="displayBadgeEmoji">&#128308;</span> <span id="displayBadgeText">NEW MUSIC OUT NOW</span></div>
            <h1 id="displayName">Your Artist Name</h1>
            <p class="subtitle" id="displaySubtitle">Latest single streaming everywhere</p>

            <nav class="links" id="linksContainer" aria-label="Social and streaming links">
                <!-- Links injected here -->
            </nav>

            <div class="footer">Promo Engine</div>
        </div>
    </div>

    <!-- EDITOR MODAL -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Edit Profile</div>
                <button class="close-btn" onclick="closeEditor()">&times;</button>
            </div>

            <div class="form-group">
                <label>Artist Name</label>
                <input type="text" id="editName">
            </div>

            <div class="form-group">
                <label>Subtitle</label>
                <input type="text" id="editSubtitle">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Badge Emoji</label>
                    <input type="text" id="editBadgeEmoji" maxlength="2">
                </div>
                <div class="form-group">
                    <label>Badge Text</label>
                    <input type="text" id="editBadgeText">
                </div>
            </div>

            <div class="form-group">
                <label>Avatar Emoji</label>
                <input type="text" id="editAvatar" maxlength="2">
            </div>

            <div class="divider"></div>

            <label style="margin-bottom:10px; display:block;">Links</label>
            <div id="linkEditors"></div>

            <div class="actions">
                <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                <button class="btn btn-danger" onclick="deleteAccount()">Delete This Account</button>
                <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // --- Data & State ---
        const STORAGE_KEY = 'promoengine_accounts';
        const SESSION_KEY = 'promoengine_current';

        const DEFAULT_LINKS = [
            { id: 'spotify', label: 'Spotify', url: '', icon: '&#127925;' },
            { id: 'apple', label: 'Apple Music', url: '', icon: '&#127822;' },
            { id: 'youtube', label: 'YouTube', url: '', icon: '&#9654;' },
            { id: 'soundcloud', label: 'SoundCloud', url: '', icon: '&#9729;' },
            { id: 'bandcamp', label: 'Bandcamp', url: '', icon: '&#128190;' }
        ];

        function getDefaultProfile(name) {
            return {
                artistName: name || 'Your Artist Name',
                subtitle: 'Latest single streaming everywhere',
                badgeText: 'NEW MUSIC OUT NOW',
                badgeEmoji: '🔴',
                avatarEmoji: '🎵',
                links: JSON.parse(JSON.stringify(DEFAULT_LINKS))
            };
        }

        function getAccounts() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
            catch { return {}; }
        }

        function saveAccounts(accounts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
        }

        function getCurrentAccountId() {
            return localStorage.getItem(SESSION_KEY) || '';
        }

        function setCurrentAccountId(id) {
            if (id) localStorage.setItem(SESSION_KEY, id);
            else localStorage.removeItem(SESSION_KEY);
        }

        let currentProfile = null;
        let currentId = '';

        // --- Auth ---
        function slugify(name) {
            return name.toLowerCase().trim().replace(/\s+/g, '_').replace(/[^\w]/g, '');
        }

        function login() {
            const nameInput = document.getElementById('artistNameInput');
            const pinInput = document.getElementById('pinInput');
            const name = nameInput.value.trim();

            if (!name) {
                nameInput.style.borderColor = 'var(--danger)';
                setTimeout(() => nameInput.style.borderColor = '', 1000);
                return;
            }

            const id = slugify(name);
            const accounts = getAccounts();

            if (!accounts[id]) {
                accounts[id] = {
                    pin: pinInput.value || '',
                    data: getDefaultProfile(name)
                };
                saveAccounts(accounts);
            } else {
                // Optional PIN check if one was set
                if (accounts[id].pin && accounts[id].pin !== pinInput.value) {
                    pinInput.style.borderColor = 'var(--danger)';
                    setTimeout(() => pinInput.style.borderColor = '', 1000);
                    alert('Incorrect PIN');
                    return;
                }
            }

            setCurrentAccountId(id);
            loadAccount(id);
        }

        function switchToAccount(id) {
            const accounts = getAccounts();
            if (accounts[id]) {
                setCurrentAccountId(id);
                loadAccount(id);
            }
        }

        function logout() {
            setCurrentAccountId('');
            currentProfile = null;
            currentId = '';
            showView('loginView');
            renderAccountList();
        }

        function deleteAccount() {
            if (!confirm('Delete this account and all its data? This cannot be undone.')) return;
            const accounts = getAccounts();
            delete accounts[currentId];
            saveAccounts(accounts);
            closeEditor();
            logout();
        }

        // --- App ---
        function loadAccount(id) {
            const accounts = getAccounts();
            if (!accounts[id]) { logout(); return; }
            currentId = id;
            currentProfile = JSON.parse(JSON.stringify(accounts[id].data));
            renderBio();
            showView('appView');
        }

        function renderBio() {
            const p = currentProfile;
            document.getElementById('displayName').textContent = p.artistName;
            document.getElementById('displaySubtitle').textContent = p.subtitle;
            document.getElementById('displayBadgeText').textContent = p.badgeText;
            document.getElementById('displayBadgeEmoji').textContent = p.badgeEmoji;
            document.getElementById('displayAvatar').textContent = p.avatarEmoji;

            const container = document.getElementById('linksContainer');
            container.innerHTML = '';

            const hasLinks = p.links.some(l => l.url.trim() !== '');

            if (!hasLinks) {
                container.innerHTML = `
                    <div class="empty-state">
                        No links added yet.<br>
                        Tap <strong>Edit</strong> to add your streaming links.
                    </div>
                `;
                return;
            }

            p.links.forEach(link => {
                const url = link.url.trim();
                const a = document.createElement('a');
                a.className = 'link-btn' + (url ? '' : ' disabled');
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                if (url) a.href = url;

                a.innerHTML = `
                    <span class="link-icon">${link.icon}</span>
                    <span>${link.label}</span>
                `;
                container.appendChild(a);
            });
        }

        // --- Editor ---
        function openEditor() {
            const p = currentProfile;
            document.getElementById('editName').value = p.artistName;
            document.getElementById('editSubtitle').value = p.subtitle;
            document.getElementById('editBadgeEmoji').value = p.badgeEmoji;
            document.getElementById('editBadgeText').value = p.badgeText;
            document.getElementById('editAvatar').value = p.avatarEmoji;

            const editors = document.getElementById('linkEditors');
            editors.innerHTML = '';

            p.links.forEach((link, idx) => {
                const div = document.createElement('div');
                div.className = 'link-editor';
                div.innerHTML = `
                    <div class="link-editor-header">
                        <span>${link.icon}</span>
                        <span>${link.label}</span>
                    </div>
                    <div class="form-group" style="margin-bottom:8px;">
                        <label style="font-size:11px;">URL</label>
                        <input type="url" class="link-url" data-idx="${idx}" value="${link.url}" placeholder="https://...">
                    </div>
                    <div class="row">
                        <div class="form-group" style="margin-bottom:0;">
                            <label style="font-size:11px;">Label</label>
                            <input type="text" class="link-label" data-idx="${idx}" value="${link.label}">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label style="font-size:11px;">Icon (emoji)</label>
                            <input type="text" class="link-icon-input" data-idx="${idx}" value="${link.icon}" maxlength="4">
                        </div>
                    </div>
                `;
                editors.appendChild(div);
            });

            document.getElementById('editorModal').classList.add('active');
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.remove('active');
        }

        function saveProfile() {
            const p = currentProfile;
            p.artistName = document.getElementById('editName').value.trim() || p.artistName;
            p.subtitle = document.getElementById('editSubtitle').value.trim();
            p.badgeEmoji = document.getElementById('editBadgeEmoji').value.trim();
            p.badgeText = document.getElementById('editBadgeText').value.trim();
            p.avatarEmoji = document.getElementById('editAvatar').value.trim();

            document.querySelectorAll('.link-url').forEach(input => {
                const idx = parseInt(input.dataset.idx);
                p.links[idx].url = input.value.trim();
            });
            document.querySelectorAll('.link-label').forEach(input => {
                const idx = parseInt(input.dataset.idx);
                p.links[idx].label = input.value.trim() || p.links[idx].label;
            });
            document.querySelectorAll('.link-icon-input').forEach(input => {
                const idx = parseInt(input.dataset.idx);
                p.links[idx].icon = input.value.trim() || p.links[idx].icon;
            });

            const accounts = getAccounts();
            if (accounts[currentId]) {
                accounts[currentId].data = p;
                saveAccounts(accounts);
            }

            closeEditor();
            renderBio();
        }

        // --- UI Helpers ---
        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function renderAccountList() {
            const accounts = getAccounts();
            const ids = Object.keys(accounts);
            const section = document.getElementById('savedAccountsSection');
            const list = document.getElementById('accountList');

            if (ids.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = '';

            ids.forEach(id => {
                const acc = accounts[id];
                const card = document.createElement('div');
                card.className = 'account-card';
                card.onclick = () => switchToAccount(id);
                card.innerHTML = `
                    <div class="account-info">
                        <div class="account-avatar">${acc.data.avatarEmoji || '&#127925;'}</div>
                        <div class="account-name">${acc.data.artistName}</div>
                    </div>
                    <span style="color:var(--text-muted); font-size:13px;">&#10132;</span>
                `;
                list.appendChild(card);
            });
        }

        // --- Init ---
        (function init() {
            const savedId = getCurrentAccountId();
            if (savedId) {
                loadAccount(savedId);
            } else {
                renderAccountList();
            }
        })();
    </script>
</body>
</html>
